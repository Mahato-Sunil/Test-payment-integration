<!DOCTYPE html>
<html>
<title>W3.CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">

<body>

    <div class="w3-card-4">
        <div class="w3-container w3-blue">
            <h2>Payment Form </h2>
        </div>

        <form class="w3-container" method="post" action="./payment_processor.php">
            <p>
                <label class="w3-text-indigo"><b> Full Name </b></label>
                <input class="w3-input w3-border w3-light-grey" name="fullname" type="text">
            </p>

            <p>
                <label class="w3-text-indigo"><b> Email </b></label>
                <input class="w3-input w3-border w3-light-grey" name="email" type="email">
            </p>

            <p>
                <label class="w3-text-indigo"><b> Phone Number </b></label>
                <input class="w3-input w3-border w3-light-grey" name="number" type="number">
            </p>

            
            <p>
                <label class="w3-text-indigo"><b> Product Name  </b></label>
                <input class="w3-input w3-border w3-light-grey" name="pname" type="text">
            </p>

            <p>
                <label class="w3-text-indigo"><b> Product ID </b></label>
                <input class="w3-input w3-border w3-light-grey" name="pid" type="text">
            </p>

            <p>
                <label class="w3-text-indigo"><b> Amount [Rs. 10 - 990] </b></label>
                <input class="w3-input w3-border w3-light-grey" name="amount" type="number">
            </p>
            <p>
                <button type="submit" name="pay_btn" class="w3-btn w3-blue"> Pay With Khalti </button>
            </p>
        </form>
    </div>

</body>

</html>
